<div class="modal-content">
  <div class="modal-header">
    <div class="modal-title h4" id="example-modal-sizes-title-lg">
      <i class="icon-2x text-dark-50 flaticon-file-1 mx-2"></i> <span class="text-uppercase fw-bold">Crear Slider</span>
    </div>
  </div>
  <div class="overlay overlay-block cursor-default modal-body">
    <!-- <ng-container *ngIf="isLoading$ | async">
        <div class="overlay-layer bg-transparent">
          <div class="spinner spinner-lg spinner-success"></div>
        </div>
      </ng-container> -->

    <div class="row">

    <div class="col-12 mb-4">
      <label>Ubicación del banner</label>
      <select class="form-control"
              name="placement"
              [(ngModel)]="placement">
        <option value="home">Home</option>
        <option value="editorial">Store Editorial</option>
      </select>

      <small class="form-text text-muted"
             *ngIf="placement === 'editorial'">
        El banner se publicará en Store Editorial.
        El texto permanece centrado y la navegación conserva el diseño original de Store Editorial.
      </small>
    </div>

    <div class="col-12 mb-4" *ngIf="placement === 'editorial'">
      <label for="editorialCategory">
        Categoría editorial <span class="text-danger">*</span>
      </label>
      <select class="form-control"
              id="editorialCategory"
              name="editorial_category"
              [(ngModel)]="editorial_category">
        <option value="default">Default - Campaña principal</option>
        <option value="t-shirts">T-Shirts</option>
        <option value="hoodies">Hoodies</option>
        <option value="mugs">Mugs</option>
        <option value="caps">Caps</option>
      </select>
      <small class="form-text text-muted">
        Selecciona la categoría asociada a esta campaña editorial.
      </small>
    </div>

    <div class="col-12 mb-4">
      <label>Estado</label>
      <select class="form-control"
              name="state"
              [(ngModel)]="state">
        <option [ngValue]="1">Activo</option>
        <option [ngValue]="0">Inactivo</option>
      </select>
    </div>

      <div class="col-12 col-lg-12">
        <div class="form-group">
          <label for="">
            {{ placement === 'editorial' ? 'Título identificativo' : 'Título' }}
            <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            placeholder=""
            [(ngModel)]="name"
            name="name"
          />
        </div>
      </div>
      <div class="col-12 col-lg-12" *ngIf="placement === 'home'">
        <div class="form-group">
          <label for="">Subtítulo</label>
          <input
            type="text"
            class="form-control"
            placeholder="Subtítulo"
            [(ngModel)]="subtitle"
            name="subtitle"
          />
        </div>
      </div>
      <div class="col-12 col-lg-12" *ngIf="placement === 'home'">
        <div class="form-group">
          <label for="">Descripción</label>
          <textarea
            class="form-control"
            placeholder="Descripción"
            [(ngModel)]="description"
            name="description"
          ></textarea>
        </div>
      </div>
      <div class="col-12 col-lg-12" *ngIf="placement === 'home'">
        <div class="form-group">
          <label for="">Link <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder=""
            [(ngModel)]="link"
            name="link"
          />
        </div>
      </div>
      <div class="col-12 col-lg-12" *ngIf="placement === 'home'">
        <div class="form-group">
          <label for="">Posición del texto</label>
          <select class="form-control" [(ngModel)]="position" name="position">
            <option value="middle-left">Izquierda</option>
            <option value="middle-right">Derecha</option>
          </select>
        </div>
      </div>

      <div class="col-12" *ngIf="placement === 'editorial'">
        <div class="form-group">
          <label>Posición del texto</label>
          <input type="text"
                 class="form-control"
                 value="Centrado"
                 readonly>
          <small class="form-text text-muted">
            Posición fija del diseño editorial.
          </small>
        </div>
      </div>

      <div class="col-12">
        <div class="row">
          <div class="col-12 mb-3">
            <label class="form-label">Imagen para Mobile: *</label>
            <div class="custom-file">
              <input
                type="file"
                class="custom-file-input"
                id="customFileMobile"
                accept=".jpeg, .bmp, .jpg, .png, .gif, .webp"
                (change)="processFileMobile($event)"
              />
              <label class="custom-file-label" for="customFileMobile"
                >Elige archivo</label
              >
            </div>
            <div *ngIf="image_mobile_preview" class="mt-2">
              <img
                [src]="image_mobile_preview"
                style="width: 150px"
                alt="Mobile preview"
              />
            </div>
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Imagen para Desktop: *</label>
            <div class="custom-file">
              <input
                type="file"
                class="custom-file-input"
                id="customFileDesktop"
                accept=".jpeg, .bmp, .jpg, .png, .gif, .webp"
                (change)="processFileDesktop($event)"
              />
              <label class="custom-file-label" for="customFileDesktop"
                >Elige archivo</label
              >
            </div>
            <div *ngIf="image_desktop_preview" class="mt-2">
              <img
                [src]="image_desktop_preview"
                style="width: 150px"
                alt="Desktop preview"
              />
            </div>
          </div>
        </div>
        <!--
              <label class="form-label">Sube tu imagen: *</label>
              <div class="custom-file">
                  <input type="file" class="custom-file-input" id="customFile"  accept=".jpeg, .bmp, .jpg, .png, .gif, .webp"  (change)="processFile($event)">
                  <label class="custom-file-label" for="customFile">Choose file</label>
                  <div class="" *ngIf="this.image_preview">
                      <img [src]="this.image_preview" style="width: 150px;" alt="" srcset="">
                  </div>
              </div>
              -->
      </div>  
    </div>
  </div>
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-primary btn-elevate mr-2"
      (click)="save()"
    >
      Guardar
    </button>

    <button
      type="button"
      class="btn btn-light btn-elevate mr-2"
      (click)="modal.dismiss()"
    >
      Cancel
    </button>
  </div>
</div>
